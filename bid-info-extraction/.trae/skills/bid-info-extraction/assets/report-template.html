<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招标关键信息提取报告</title>
<style>
  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --text: #2c2c2c;
    --muted: #6b6b6b;
    --border: #e0dbd1;
    --accent: #8b7355;
    --tag-bg: #f0ebe3;
    --danger: #c0392b;
    --danger-bg: #fdf2f2;
    --warn: #d4a017;
    --warn-bg: #fef9ee;
    --ok: #2e7d32;
    --ok-bg: #e8f5e9;
    --star: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 40px 20px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  .info-grid .label { color: var(--muted); font-size: 13px; }
  .info-grid .value { font-size: 14px; word-break: break-all; }
  .info-grid .value.null { color: #ccc; font-style: italic; }
  @media (max-width: 640px) { .info-grid { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--tag-bg); font-weight: 600; font-size: 12px; color: var(--muted); }
  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; font-weight: 600;
  }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
  .badge-tag { background: var(--tag-bg); color: var(--accent); }
  .badge-selected { background: var(--ok-bg); color: var(--ok); }

  .star { color: var(--star); font-weight: 700; margin-right: 2px; }

  .clause-list { list-style: none; }
  .clause-list li {
    padding: 6px 12px; margin: 4px 0; border-radius: 6px;
    background: var(--tag-bg); font-size: 13px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .clause-list .cat { flex-shrink: 0; font-size: 11px; }
  .clause-list li.danger { background: var(--danger-bg); }

  .timeline-bar {
    display: flex; gap: 0; margin: 12px 0; overflow-x: auto;
  }
  .timeline-item {
    flex: 1; min-width: 100px; text-align: center; padding: 10px 6px;
    border-right: 1px solid var(--border); font-size: 12px;
  }
  .timeline-item:last-child { border-right: none; }
  .timeline-item .date { font-weight: 700; color: var(--accent); font-size: 14px; }
  .timeline-item .label { color: var(--muted); margin-top: 2px; }

  .section { margin-top: 16px; }
  .section-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 12px 0 6px; }

  .kv { display: flex; padding: 4px 0; font-size: 13px; }
  .kv .k { color: var(--muted); width: 120px; flex-shrink: 0; }
  .kv .v { flex: 1; }

  .quote {
    background: var(--tag-bg); border-left: 3px solid var(--accent);
    padding: 10px 14px; margin: 8px 0; font-size: 13px; border-radius: 0 6px 6px 0;
  }

  .req-list { list-style: disc; padding-left: 20px; }
  .req-list li { padding: 3px 0; font-size: 13px; }

  .null { color: #ccc; font-style: italic; }

  /* Risk-specific styles */
  .risk-summary-bar { display: flex; gap: 8px; margin: 12px 0; }
  .risk-stat {
    flex: 1; text-align: center; padding: 10px 6px; border-radius: 6px;
    color: white; font-weight: 600; font-size: 13px;
  }
  .risk-stat .num { font-size: 24px; display: block; }
  .risk-stat .lbl { font-size: 11px; opacity: 0.9; }
  .risk-stat.total { background: var(--accent); }
  .risk-stat.high { background: var(--danger); }
  .risk-stat.medium { background: var(--warn); }
  .risk-stat.low { background: var(--ok); }

  .risk-card {
    padding: 10px 14px; margin: 6px 0; border-radius: 6px;
    border-left: 4px solid; font-size: 13px;
  }
  .risk-card.high { border-color: var(--danger); background: var(--danger-bg); }
  .risk-card.medium { border-color: var(--warn); background: var(--warn-bg); }
  .risk-card.low { border-color: var(--ok); background: var(--ok-bg); }
  .risk-card .finding { font-weight: 600; margin-bottom: 4px; }
  .risk-card .location { color: var(--muted); font-size: 12px; }
  .risk-card .suggestion { margin-top: 4px; color: #475569; }
  .risk-card .policy-ref {
    margin-top: 6px; font-size: 12px; color: var(--danger);
    background: var(--danger-bg); padding: 6px 10px; border-radius: 4px;
  }

  .overall-risk { margin: 8px 0; font-size: 13px; font-weight: 600; }
  .overall-risk .level-high { color: var(--danger); }
  .overall-risk .level-medium { color: var(--warn); }
  .overall-risk .level-low { color: var(--ok); }

  .summary-box {
    margin-top: 12px; padding: 10px 14px;
    background: var(--tag-bg); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; font-size: 13px;
  }

  .footer {
    text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0;
  }

  @media print {
    body { padding: 0; }
    .card { break-inside: avoid; }
  }
</style>
</head>

</div>

function esc(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var cardNum = 0;
function nextNum() { cardNum++; return cardNum; }

function cardWrap(title, badgeHtml, bodyHtml) {
  return '<div class="card"><div class="card-title"><span class="num">' + nextNum() + '</span>' + esc(title) + (badgeHtml || '') + '</div>' + bodyHtml + '</div>';
}

function renderRisks(d) {
  var risks = (d.riskAnalysis && d.riskAnalysis.warnings) || [];
  var el = document.getElementById('riskSummary');
  if (!risks.length) {
    el.innerHTML = cardWrap('风险分析', '', '<div class="null">无风险提示</div>');
    return;
  }
  var high = risks.filter(function(r){return r.severity==='high';}).length;
  var med = risks.filter(function(r){return r.severity==='medium';}).length;
  var low = risks.filter(function(r){return r.severity==='low';}).length;
  var html = cardWrap('风险分析', '<span class="badge badge-danger" style="margin-left:auto">共' + risks.length + '条</span>',
    '<div class="risk-summary-bar">' +
      '<div class="risk-stat total"><span class="num">' + risks.length + '</span><span class="lbl">总风险</span></div>' +
      '<div class="risk-stat high"><span class="num">' + high + '</span><span class="lbl">高风险</span></div>' +
      '<div class="risk-stat medium"><span class="num">' + med + '</span><span class="lbl">中风险</span></div>' +
      '<div class="risk-stat low"><span class="num">' + low + '</span><span class="lbl">低风险</span></div>' +
    '</div>'
  );
  var level = d.riskAnalysis.overallRiskLevel || '';
  if (level) {
    html += '<div class="overall-risk">总体风险等级: <span class="level-' + level + '">' + esc(level === 'high' ? '高' : level === 'medium' ? '中' : '低') + '</span></div>';
  }
  for (var i = 0; i < risks.length; i++) {
    var r = risks[i];
    html += '<div class="risk-card ' + r.severity + '">';
    html += '<span class="badge badge-' + (r.severity === 'high' ? 'danger' : r.severity === 'medium' ? 'warn' : 'selected') + '">' + r.severity.toUpperCase() + '</span> ';
    html += '<span class="badge badge-tag">' + esc(r.ruleId || '') + '</span> ';
    html += '<span class="badge badge-tag">' + esc(r.category || '') + '</span>';
    html += '<div class="finding">' + esc(r.finding) + '</div>';
    if (r.location) html += '<div class="location">位置: ' + esc(r.location) + '</div>';
    html += '<div class="suggestion">建议: ' + esc(r.suggestion) + '</div>';
    if (r.companyPolicy) html += '<div class="policy-ref">公司政策: ' + esc(r.companyPolicy) + '</div>';
    html += '</div>';
  }
  if (d.riskAnalysis.summary) {
    html += '<div class="summary-box"><strong>综合建议:</strong> ' + esc(d.riskAnalysis.summary) + '</div>';
  }
  el.innerHTML = html;
}

function renderBasicInfo(d) {
  var b = d.basicInfo || {};
  var body = '<div class="info-grid">';
  body += '<div class="label">项目名称</div><div class="value"><strong>' + esc(b.projectName || '') + '</strong></div>';
  body += '<div class="label">项目编号</div><div class="value">' + esc(b.projectNumber || '') + '</div>';
  body += '<div class="label">预算金额</div><div class="value"><strong>' + esc(b.budget || '') + '</strong></div>';
  if (b.bidder && b.bidder.name) {
    body += '<div class="label">采购人</div><div class="value">' + esc(b.bidder.name) + '</div>';
    if (b.bidder.contact) body += '<div class="label">采购人联系人</div><div class="value">' + esc(b.bidder.contact) + '</div>';
  }
  if (b.agent && b.agent.name) {
    body += '<div class="label">代理机构</div><div class="value">' + esc(b.agent.name) + '</div>';

    body += '<div class="section-label">项目简介</div><div class="quote">' + esc(b.projectDescription) + '</div>';

}

function renderTimeline(d) {
  var t = d.timeline || {};
  var items = [
    {l: '投标截止时间', v: t.bidDeadline, critical: true},
    {l: '开标时间', v: t.bidOpening, critical: true},
    {l: '答疑截止时间', v: t.qaDeadline, critical: false},
    {l: '保证金提交截止', v: t.depositDeadline, critical: false},
    {l: '投标保证金', v: t.bidBond, critical: false}
  ];
  if (t.otherDates) {
    for (var i = 0; i < t.otherDates.length; i++) {
      items.push({l: t.otherDates[i].label || '其他', v: t.otherDates[i].date, critical: false});
    }
  }
  var body = '';
  // timeline bar for critical items
  var barItems = items.filter(function(x){return x.v && x.critical;});
  if (barItems.length) {
    body += '<div class="timeline-bar">';
    for (var j = 0; j < barItems.length; j++) {
      body += '<div class="timeline-item" style="background:var(--warn-bg)"><div class="date">' + esc(barItems[j].v) + '</div><div class="label">' + esc(barItems[j].l) + '</div></div>';
    }
    body += '</div>';
  }
  // table
  body += '<table><thead><tr><th>节点</th><th>时间</th><th>状态</th></tr></thead><tbody>';
  for (var k = 0; k < items.length; k++) {
    if (!items[k].v) {
      body += '<tr><td>' + esc(items[k].l) + '</td><td><span class="null">未提及</span></td><td></td></tr>';
    } else {
      body += '<tr><td>' + esc(items[k].l) + '</td><td>' + esc(items[k].v) + '</td><td>' +
        (items[k].critical ? '<span class="badge badge-danger">关键</span>' : '<span class="badge badge-warn">注意</span>') + '</td></tr>';
    }
  }
  body += '</tbody></table>';
  document.getElementById('timeline').innerHTML = cardWrap('关键时间节点', '', body);
}

function renderDisqualifyingFactors(d) {
  var factors = d.disqualifyingFactors || [];
  var body = '';
  if (!factors.length) {
    body = '<div class="null">未识别到明确的废标因素</div>';
  } else {
    body = '<ul class="clause-list">';
    for (var i = 0; i < factors.length; i++) {
      body += '<li class="danger"><span class="cat badge badge-tag">废标</span>' + esc(factors[i]) + '</li>';
    }
    body += '</ul>';
  }
  document.getElementById('disqualifyingFactors').innerHTML = cardWrap('废标与无效投标条款', '<span class="badge badge-danger" style="margin-left:auto">共' + factors.length + '条</span>', body);
}

function renderEvaluationCriteria(d) {
  var e = d.evaluationCriteria || {};
  var body = '';
  if (e.method) {
    body += '<div class="quote"><strong>评标方法：</strong>' + esc(e.method) + '</div>';
  }
  if (e.items && e.items.length) {
    body += '<table><thead><tr><th>评分项</th><th>权重</th><th>评分规则</th><th>备注</th></tr></thead><tbody>';
    for (var i = 0; i < e.items.length; i++) {
      var item = e.items[i];
      body += '<tr><td>' + esc(item.name) + '</td><td>' + esc(item.weight != null ? item.weight + '%' : '-') + '</td><td>' + esc(item.scoringRule || '') + '</td><td>' + esc(item.notes || '') + '</td></tr>';
    }
    body += '</tbody></table>';
  } else {
    body += '<div class="null">未识别到明确的评分标准</div>';
  }
  document.getElementById('evaluationCriteria').innerHTML = cardWrap('评分标准', '', body);

function renderContractTerms(d) {
  var c = d.contractTerms || {};
  var body = '';
  if (c.deliveryRequirements) {
    body += '<div class="section-label">交付要求</div><div class="quote">' + esc(c.deliveryRequirements) + '</div>';
  }
  if (c.acceptanceCriteria) {
    body += '<div class="section-label">验收标准</div><div class="quote">' + esc(c.acceptanceCriteria) + '</div>';
  }
  var sections = [
    {l: '违约责任', v: c.penaltyClauses},
    {l: '知识产权', v: c.ipClauses},
    {l: '保密条款', v: c.confidentialityClauses},
    {l: '赔偿条款', v: c.indemnityClauses},
    {l: '终止条款', v: c.terminationClauses},
    {l: '其他条款', v: c.otherTerms}
  ];
  for (var i = 0; i < sections.length; i++) {
    if (!sections[i].v || !sections[i].v.length) continue;
    body += '<div class="section-label">' + esc(sections[i].l) + '</div>';
    body += '<ul class="clause-list">';
    for (var j = 0; j < sections[i].v.length; j++) {
      body += '<li><span class="cat badge badge-tag">' + esc(sections[i].l) + '</span>' + esc(sections[i].v[j]) + '</li>';
    }
    body += '</ul>';
  }
  document.getElementById('contractTerms').innerHTML = cardWrap('合同草案关键条款', '', body);
}

  body += '</div>';
  if (s.other && s.other.length) {
    body += '<div class="section-label">其他要求</div><ul class="req-list">';
    for (var i = 0; i < s.other.length; i++) body += '<li>' + esc(s.other[i]) + '</li>';
    body += '</ul>';
  }
  document.getElementById('submissionRequirements').innerHTML = cardWrap('投标文件编制与封装', '', body);

function renderDeviationRequirements(d) {
  var dv = d.deviationRequirements || {};
  var body = '';
  if (dv.mustRespondItemByItem) {
    body += '<div class="kv"><span class="k">逐条响应</span><span class="v"><span class="badge badge-danger">是</span></span></div>';
  }
  if (dv.noDeviationAllowed) {
    body += '<div class="kv"><span class="k">允许偏离</span><span class="v"><span class="badge badge-danger">否</span></span></div>';
  }
  if (dv.deviationItems && dv.deviationItems.length) {
    body += '<div class="section-label">已识别的偏离项</div><ul class="req-list">';
    for (var i = 0; i < dv.deviationItems.length; i++) body += '<li>' + esc(dv.deviationItems[i]) + '</li>';
    body += '</ul>';
  }
  if (!dv.mustRespondItemByItem && !dv.noDeviationAllowed && (!dv.deviationItems || !dv.deviationItems.length)) {
    body = '<div class="null">未识别到明确的偏离项要求</div>';
  }
  document.getElementById('deviationRequirements').innerHTML = cardWrap('偏离项要求', '', body);
}

function init() {
  var d = window.__BID_DATA__ || {};
  var b = d.basicInfo || {};
  document.getElementById('pageTitle').textContent = b.projectName || '招标关键信息提取报告';
  document.getElementById('pageSubtitle').textContent =
    '项目编号：' + esc(b.projectNumber || '') +
    ' | 预算：' + esc(b.budget || '') +
    ' | 提取时间：' + esc((d.meta || {}).extractedAt || '');
  cardNum = 0;
  renderRisks(d);
  renderBasicInfo(d);
  renderTimeline(d);
  renderDisqualifyingFactors(d);
  renderQualifications(d);
  renderTechnicalRequirements(d);
  renderCommercialRequirements(d);
  renderEvaluationCriteria(d);
  renderContractTerms(d);
  renderSubmissionRequirements(d);
  renderDeviationRequirements(d);
  document.getElementById('footer').textContent =
    '基于 bid-info-extraction 规范生成 · Schema版本 ' + esc((d.meta || {}).version || '') + ' · 生成时间：' + esc((d.meta || {}).extractedAt || '');
}
document.addEventListener('DOMContentLoaded', init);
